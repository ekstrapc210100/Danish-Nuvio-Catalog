services:
  - type: web
    name: danske-stremio-katalog
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TMDB_API_KEY
        sync: false
      # Postgres connection string; without it catalogs are served live from TMDB.
      - key: DATABASE_URL
        sync: false
      # Shared secret for POST /internal/discover (also stored as a GitHub Actions secret).
      - key: DISCOVER_SECRET
        sync: false
